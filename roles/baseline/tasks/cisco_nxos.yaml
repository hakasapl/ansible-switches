---
- name: Enable sftp-server feature
  cisco.nxos.nxos_feature:
    feature: sftp-server
    state: enabled
  notify: Save Config

- name: Enable scp-server feature
  cisco.nxos.nxos_feature:
    feature: scp-server
    state: enabled
  notify: Save Config

- name: Enable vpc feature
  cisco.nxos.nxos_feature:
    feature: vpc
    state: enabled
  notify: Save Config

- name: Enable lacp feature
  cisco.nxos.nxos_feature:
    feature: lacp
    state: enabled
  notify: Save Config

- name: Enable vlan interface feature
  cisco.nxos.nxos_feature:
    feature: interface-vlan
    state: enabled
  notify: Save Config

- name: Enable LLDP feature
  cisco.nxos.nxos_feature:
    feature: lldp
    state: enabled
  notify: Save Config

- name: Enable SNMP
  cisco.nxos.nxos_snmp_server:
    config:
      communities:
        - community: public
          group: network-operator
